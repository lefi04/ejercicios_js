<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario de contacto</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1b1f24;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  .card {
    width: 100%;
    max-width: 380px;
    background: #262b32;
    border-radius: 14px;
    padding: 28px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }

  h1 {
    color: #f2f4f6;
    font-size: 22px;
    margin: 0 0 24px;
  }

  /* Cada "campo" agrupa la etiqueta + el input + su mensaje de error */
  .field {
    margin-bottom: 18px;
  }

  label {
    display: block;
    color: #c7ccd1;
    font-size: 14px;
    margin-bottom: 6px;
  }

  input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #3c434d;
    background: #1b1f24;
    color: #f2f4f6;
    font-size: 15px;
    outline: none;
  }

  input:focus {
    border-color: #5b8cff;
  }

  /* Clase que se agrega vía JS cuando un campo tiene error,
     para pintarle el borde de rojo */
  input.input-error {
    border-color: #e5484d;
  }

  /* Mensaje de error debajo de cada campo. Empieza vacío y oculto */
  .error-msg {
    color: #e5484d;
    font-size: 13px;
    margin-top: 6px;
    min-height: 16px; /* reserva espacio para que el form no "salte" */
  }

  #submit-btn {
    width: 100%;
    padding: 11px;
    border: none;
    border-radius: 8px;
    background: #5b8cff;
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 6px;
  }

  #submit-btn:hover {
    background: #4577f0;
  }

  /* Mensaje de éxito general, debajo del botón. Oculto hasta que se necesite */
  #success-msg {
    display: none;
    color: #4ade80;
    background: rgba(74, 222, 128, 0.1);
    border: 1px solid rgba(74, 222, 128, 0.3);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    margin-top: 16px;
    text-align: center;
  }
</style>
</head>
<body>

  <div class="card">
    <h1>Contactanos</h1>

    <!-- 
      Usamos <form> para agrupar los campos.
      No le ponemos action ni method porque no vamos a enviar
      a un servidor real: todo el manejo lo hace JS.
    -->
    <form id="contact-form">

      <div class="field">
        <label for="name-input">Nombre</label>
        <input type="text" id="name-input" placeholder="Tu nombre">
        <!-- Acá JS va a escribir el mensaje de error si falta completar -->
        <div class="error-msg" id="name-error"></div>
      </div>

      <div class="field">
        <label for="email-input">Correo electrónico</label>
        <input type="text" id="email-input" placeholder="tu@email.com">
        <div class="error-msg" id="email-error"></div>
      </div>

      <button type="submit" id="submit-btn">Enviar</button>

      <div id="success-msg">✓ ¡Formulario enviado con éxito!</div>

    </form>
  </div>

<script>

/* 
     Guardamos en variables cada elemento que vamos a necesitar
     leer o modificar desde JS.
*/
  const form = document.getElementById('contact-form');

  const nameInput = document.getElementById('name-input');
  const emailInput = document.getElementById('email-input');

  const nameError = document.getElementById('name-error');
  const emailError = document.getElementById('email-error');

  const successMsg = document.getElementById('success-msg');


  // Función Auxiliar
  function setFieldError(input, errorEl, message) {
    errorEl.textContent = message;

    if (message) {
      // Si hay mensaje, agregamos la clase que pinta el borde rojo
      input.classList.add('input-error');
    } else {
      // Si no hay mensaje, sacamos esa clase (campo válido)
      input.classList.remove('input-error');
    }
  }


  /* ===========================================================
     VALIDAR Y ENVIAR: corre cada vez que el usuario aprieta "Enviar".
     =========================================================== */
  function handleSubmit(event) {
    
    event.preventDefault();

    // Ocultamos el mensaje de éxito por si venía de un envío anterior
    successMsg.style.display = 'none';

    // .trim() saca espacios en blanco de los costados,
    // así " " (solo espacios) no cuenta como "completo"
    const nameValue = nameInput.value.trim();
    const emailValue = emailInput.value.trim();

    // Empezamos asumiendo que todo está bien, y lo vamos
    // invalidando si encontramos algún problema
    let isValid = true;

    // --- Validación del nombre ---
    if (nameValue === '') {
      setFieldError(nameInput, nameError, 'El nombre es obligatorio');
      isValid = false;
    } else {
      setFieldError(nameInput, nameError, ''); // limpia error previo
    }

    // --- Validación del email ---
    if (emailValue === '') {
      setFieldError(emailInput, emailError, 'El correo es obligatorio');
      isValid = false;
    } else {
      setFieldError(emailInput, emailError, '');
    }

    // Si algún campo falló, no seguimos (no mostramos éxito)
    if (!isValid) {
      return;
    }

    // Si llegamos hasta acá, los dos campos están completos
    successMsg.style.display = 'block';

    // Opcional: limpiar el formulario después de "enviarlo"
    form.reset();
  }


  /* ===========================================================
     Escuchamos el evento "submit" del formulario, que se dispara
     al apretar el botón (o presionar Enter dentro de un input).
     =========================================================== */
  form.addEventListener('submit', handleSubmit);
</script>

</body>
</html>
